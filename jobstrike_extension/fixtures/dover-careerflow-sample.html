<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Software Engineer – Paid Finance Data Project (Remote)</title>
</head>
<body>
  <div class="InboundApplication__ApplicationPortalContainer">
    <div class="styles__Header">
      <div class="styles__HeaderContent">
        <a href="https://careerflow.ai"><img alt="Facet logo" class="styles__StyledLogo" src="#"></a>
        <div class="typography__TitleLarge">Software Engineer – Paid Finance Data Project (Remote)</div>
        <div>
          <div aria-label="Job location">
            <div>Remote (United States)</div>
          </div>
          <div aria-label="Employment Type">
            <div>Contract</div>
          </div>
        </div>
      </div>
    </div>
    <div class="InboundApplication__ContentContainer">
      <div class="InboundApplication__JobDescriptionWrapper">
        <div class="styles__StyledHtmlWrapper">
          <p><strong>Company:</strong> Human Data Labs<br><strong>Job Type:</strong> Contract / Project-Based</p>
          <h2><strong>About the Project</strong></h2>
          <p>Human Data Labs is looking for US-based software engineers to participate in a paid financial data project.</p>
        </div>
      </div>
      <div class="InboundApplication__FormWrapper">
        <form>
          <input name="firstName" type="text">
          <input name="lastName" type="text">
          <input name="email" type="email">
          <input name="linkedinUrl" type="text">
          <input name="phoneNumber" type="text">
        </form>
      </div>
    </div>
    <a href="https://dover.com"><img alt="Dover Logo" src="#"></a>
  </div>
</body>
</html>
