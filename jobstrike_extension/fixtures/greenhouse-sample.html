<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Greenhouse sample — JobStrike fixture</title>
</head>
<body>
  <header>Careers — Example Corp</header>
  <nav><a href="#">Jobs</a><a href="#">Login</a></nav>

  <form id="application_form" data-source="greenhouse">
    <h1 class="app-title">Software Engineer</h1>
    <div class="field">
      <label for="first_name">First Name</label>
      <input id="first_name" name="job_application[first_name]" type="text">
    </div>
    <div class="field">
      <label for="last_name">Last Name</label>
      <input id="last_name" name="job_application[last_name]" type="text">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="job_application[email]" type="email">
    </div>
    <div class="field">
      <label for="phone">Phone</label>
      <input id="phone" name="job_application[phone]" type="tel">
    </div>
    <div class="field-wrapper">
      <div class="select">
        <div class="select__container select__container--outside-label">
          <label id="candidate-location-label" for="candidate-location" class="label select__label select__label--outside-label">Location (City)<span aria-hidden="true">*</span></label>
          <div class="select-shell">
            <div class="select__control--outside-label select__control">
              <div class="select__value-container">
                <div class="select__placeholder" id="react-select-candidate-location-placeholder"></div>
                <div class="select__input-container" data-value="">
                  <input class="select__input" id="candidate-location" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-haspopup="true" aria-labelledby="candidate-location-label" aria-required="true" autocomplete="off" value="">
                </div>
              </div>
            </div>
            <input required tabindex="-1" aria-hidden="true" class="remix-css-1a0ro4n-requiredInput" value="">
          </div>
        </div>
      </div>
    </div>
    <div class="field-wrapper">
      <div class="text-input-wrapper">
        <div class="input-wrapper">
          <label id="question_5992673009-label" for="question_5992673009">LinkedIn Profile</label>
          <input id="question_5992673009" class="input input__single-line" type="text" aria-label="LinkedIn Profile">
        </div>
      </div>
    </div>
    <div class="field-wrapper">
      <div class="text-input-wrapper">
        <div class="input-wrapper">
          <label id="question_5992674009-label" for="question_5992674009">Website</label>
          <input id="question_5992674009" class="input input__single-line" type="text" aria-label="Website">
        </div>
      </div>
    </div>
    <div class="field-wrapper">
      <div class="select">
        <div class="select__container">
          <label id="4007494009-label" for="4007494009">How would you describe your gender identity?</label>
          <div class="select-shell">
            <div class="select__control">
              <div class="select__value-container">
                <div class="select__placeholder">Select...</div>
                <div class="select__input-container">
                  <input class="select__input" id="4007494009" type="text" role="combobox" aria-autocomplete="list" aria-labelledby="4007494009-label">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="field-wrapper">
      <div class="select">
        <div class="select__container">
          <label id="4007496009-label" for="4007496009">How would you describe your sexual orientation?</label>
          <div class="select-shell">
            <div class="select__control">
              <div class="select__value-container select__value-container--is-multi">
                <div class="select__placeholder">Select...</div>
                <div class="select__input-container">
                  <input class="select__input" id="4007496009" type="text" role="combobox" aria-autocomplete="list" aria-labelledby="4007496009-label">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="field-wrapper">
      <div class="select">
        <div class="select__container">
          <label id="gender-label" for="gender">Gender</label>
          <div class="select-shell">
            <div class="select__control">
              <div class="select__value-container">
                <div class="select__placeholder">Select...</div>
                <div class="select__input-container">
                  <input class="select__input" id="gender" type="text" role="combobox" aria-autocomplete="list" aria-labelledby="gender-label">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="field">
      <label for="linkedin">LinkedIn</label>
      <input id="linkedin" name="job_application[urls][LinkedIn]" type="url">
    </div>
    <div class="field-wrapper">
      <div class="label">Resume/CV</div>
      <div class="file-upload" role="group" aria-labelledby="upload-label-resume">
        <div id="upload-label-resume" class="label upload-label visually-hidden">Resume/CV</div>
        <div class="file-upload__wrapper">
          <div class="button-container">
            <div class="secondary-button">
              <div>
                <button type="button" class="btn btn--pill">Attach</button>
                <label class="visually-hidden" for="resume">Attach</label>
                <input id="resume" class="visually-hidden" name="job_application[resume]" type="file" accept=".pdf,.doc,.docx,.txt,.rtf">
              </div>
            </div>
            <div class="secondary-button">
              <button type="button" class="btn btn--pill" data-testid="resume-dropbox">Dropbox</button>
            </div>
            <div class="secondary-button">
              <button type="button" class="btn btn--pill" data-testid="resume-text">Enter manually</button>
            </div>
            <p class="file-upload__filetypes">Accepted file types: pdf, doc, docx, txt, rtf</p>
          </div>
        </div>
      </div>
    </div>
    <div class="field-wrapper">
      <div role="group" aria-labelledby="upload-label-cover_letter" class="file-upload">
        <div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
        <div class="file-upload__wrapper">
          <div class="button-container">
            <div class="secondary-button">
              <div>
                <button type="button" class="btn btn--pill">Attach</button>
                <label class="visually-hidden" for="cover_letter">Attach</label>
                <input id="cover_letter" class="visually-hidden" name="job_application[cover_letter]" type="file" accept=".pdf,.doc,.docx,.txt,.rtf">
              </div>
            </div>
            <div class="secondary-button">
              <button type="button" class="btn btn--pill" data-testid="cover_letter-dropbox">Dropbox</button>
            </div>
            <div class="secondary-button">
              <button type="button" class="btn btn--pill" data-testid="cover_letter-text">Enter manually</button>
            </div>
            <p class="file-upload__filetypes">Accepted file types: pdf, doc, docx, txt, rtf</p>
          </div>
        </div>
      </div>
    </div>
    <footer>
      <input type="text" name="footer_search" placeholder="Search site" aria-label="Search">
    </footer>
    <button type="submit">Submit application</button>
  </form>
</body>
</html>
