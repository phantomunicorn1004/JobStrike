<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Helper Ext</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="launcher.css">
  <script src="theme.js"></script>
</head>
<body class="launcher-popup">
  <div class="launcher-shell">
    <header class="launcher-header-simple">
      <img src="icons/icon-32.png" alt="" width="26" height="26" class="launcher-icon">
      <h1 class="launcher-title">Job Assistant</h1>
    </header>

    <main class="launcher-grid">
      <section class="launcher-panel launcher-primary-panel" aria-labelledby="openAssistantHeading">
        <div class="launcher-section-heading launcher-primary-heading">
          <div>
            <h2 class="launcher-section-title" id="openAssistantHeading">Open Job Assistant</h2>
            <p class="launcher-hint">Choose overlay dock, movable dialog, or Chrome’s pinned side panel.</p>
          </div>
          <button type="button" class="launcher-shortcut-btn" id="configureAssistantShortcutsBtn" title="Configure opening shortcuts">
            Set shortcuts
          </button>
        </div>

        <div class="launcher-open-modes" role="group" aria-label="Job Assistant opening mode">
          <button type="button" class="launcher-mode-btn" data-assistant-mode="left" title="Dock overlay on the left">
            <span>Left</span>
            <kbd data-command-shortcut="open-assistant-left">Set hotkey</kbd>
          </button>
          <button type="button" class="launcher-mode-btn active" data-assistant-mode="movable" title="Movable and resizable dialog">
            <span>Movable</span>
            <kbd data-command-shortcut="open-assistant-movable">Set hotkey</kbd>
          </button>
          <button type="button" class="launcher-mode-btn" data-assistant-mode="right" title="Dock overlay on the right">
            <span>Right</span>
            <kbd data-command-shortcut="open-assistant-right">Set hotkey</kbd>
          </button>
          <button type="button" class="launcher-mode-btn" data-assistant-mode="panel" title="Chrome right-side pinned panel">
            <span>Panel</span>
            <kbd data-command-shortcut="open-assistant-panel">Set hotkey</kbd>
          </button>
        </div>

        <button type="button" class="launcher-btn launcher-btn-primary" id="openSidebarBtn">
          Open Job Assistant
        </button>
      </section>

      <section class="launcher-panel launcher-secondary-panel" aria-labelledby="elementPickerHeading">
        <div class="launcher-secondary-row">
          <div>
            <h2 class="launcher-section-title" id="elementPickerHeading">Element text picker</h2>
            <p class="launcher-hint">Pick an element and copy its text.</p>
          </div>
          <button type="button" class="launcher-shortcut-btn" id="configurePickerShortcutBtn" title="Configure extension shortcuts">
            <span id="pickerShortcutLabel">Ctrl+Shift+E</span>
          </button>
        </div>
        <button type="button" class="launcher-btn launcher-secondary-action" id="startElementPickerBtn">
          Start picker
        </button>
      </section>

      <section class="launcher-panel launcher-secondary-panel" aria-labelledby="preparedLinksHeading">
        <div class="launcher-secondary-row">
          <div>
            <h2 class="launcher-section-title" id="preparedLinksHeading">Open job links</h2>
            <p class="launcher-hint">One URL per line or comma-separated.</p>
          </div>
          <span id="preparedLinksCount" class="launcher-count">0 links</span>
        </div>
        <textarea
          id="preparedLinksInput"
          class="launcher-textarea launcher-textarea-compact"
          rows="3"
          spellcheck="false"
          placeholder="https://company.com/jobs/123"
        ></textarea>
        <button type="button" class="launcher-btn launcher-secondary-action" id="startApplyBtn">Open links</button>
      </section>
    </main>

    <p id="launcherStatus" class="launcher-status" role="status" aria-live="polite"></p>
  </div>
  <script src="launcher.js"></script>
</body>
</html>
