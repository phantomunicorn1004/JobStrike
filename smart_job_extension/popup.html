<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Job Autofill Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-body">
  <div class="popup-card">
    <header class="popup-header">
      <div>
        <div class="eyebrow">Job Application Tool</div>
        <h1>Smart Job Autofill</h1>
      </div>
      <button id="closeBtn" class="icon-btn" title="Close">×</button>
    </header>

    <div class="stat-card">
      <span class="stat-number" id="applicationsCount">0</span>
      <span class="stat-label">applications saved today</span>
    </div>

    <div class="popup-actions">
      <button id="openSidePanelBtn" class="btn primary">Open Autofill Panel</button>
      <button id="quickScrapeBtn" class="btn">Scrape Current Job</button>
      <button id="downloadBtn" class="btn">Download JSON</button>
    </div>

    <div class="mini-section">
      <label>Legal Name
        <input id="userName" type="text" placeholder="Your name" autocomplete="name">
      </label>
    </div>

    <div id="status" class="toast hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>
  <script src="toast.js"></script>
  <script src="popup.js"></script>
</body>
</html>
